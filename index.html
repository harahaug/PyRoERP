<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyRoERP Ultimate - Mobile & Security Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
        .chart-bar { transition: height 0.5s ease; }
        .chart-bar:hover { opacity: 0.8; }
        .animate-fade { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#F8FAFC] dark:bg-slate-950 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { jsPDF } = window.jspdf;

        // --- HILFSFUNKTIONEN ---
        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if(window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const InputField = ({ label, value, onChange, type="text", colSpan="col-span-1", extraClass="", placeholder="", disabled=false }) => {
            return (
                <div className={colSpan}>
                    <label className="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase">{label}</label>
                    <input 
                        type={type} 
                        disabled={disabled} 
                        placeholder={placeholder} 
                        value={value !== undefined && value !== null ? value : ''} 
                        onChange={e => onChange(type === 'number' ? (e.target.value === '' ? '' : parseFloat(e.target.value)) : e.target.value)} 
                        className={`w-full bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white p-3 rounded-xl outline-none text-sm border border-transparent focus:border-indigo-400 transition-colors disabled:opacity-50 disabled:cursor-not-allowed ${extraClass}`} 
                    />
                </div>
            );
        };

        const generateNumber = (format, number) => {
            const d = new Date();
            return (format || '').replace('{YYYY}', d.getFullYear()).replace('{YY}', String(d.getFullYear()).slice(-2)).replace('{MM}', String(d.getMonth() + 1).padStart(2, '0')).replace('{DD}', String(d.getDate()).padStart(2, '0')).replace('{NR}', number);
        };

        const compressImage = (file, callback) => {
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image(); img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas'); const MAX_WIDTH = 800;
                    let width = img.width; let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                }
            };
        };

        const MOTIVATIONAL_QUOTES = [
            "Erfolg hat drei Buchstaben: TUN. – Johann Wolfgang von Goethe", "Dein Shop schläft nie. Nutze den Tag!", "Warte nicht auf Chancen, erschaffe sie.", "Kleine tägliche Verbesserungen führen zu großen Ergebnissen.", "Qualität ist das beste Rezept für treue Kunden.", "Fokus auf den Kunden, der Rest folgt von selbst.", "Machen ist wie wollen, nur krasser.", "Wer immer tut, was er schon kann, bleibt immer das, was er schon ist.", "Ziele sind Träume mit einer Deadline.", "Es ist nicht wichtig, wie langsam du gehst, solange du nicht stehen bleibst.", "Der einzige Weg, großartige Arbeit zu leisten, ist zu lieben, was man tut.", "Erfolg ist nicht der Schlüssel zum Glück. Glück ist der Schlüssel zum Erfolg.", "Ein gutes Produkt verkauft sich selbst, ein großartiger Service bringt Kunden zurück.", "Fange an, wo du bist. Nutze, was du hast. Tu, was du kannst.", "Handmade bedeutet: Mit den Händen gemacht, mit dem Herzen erdacht.", "Jeder Meister war einmal ein Anfänger. Bleib dran!", "Investiere in deine Träume, sie zahlen die besten Zinsen.", "Das beste Marketing ist ein glücklicher Kunde."
        ];

        function App() {
            const [isDark, setIsDark] = useState(() => JSON.parse(localStorage.getItem('pyro_dark')) || false);
            const [view, setView] = useState('dashboard');
            const [openId, setOpenId] = useState(null);
            
            // --- MOBILE STATE ---
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            const [searchTermKunden, setSearchTermKunden] = useState('');
            const [searchTermLager, setSearchTermLager] = useState('');
            
            const [appSettings, setAppSettings] = useState(() => {
                const s = JSON.parse(localStorage.getItem('pyro_settings')) || {};
                return { masterPassword: s.masterPassword ?? '0000', loginEnabled: s.loginEnabled ?? false, loginUser: s.loginUser ?? '', loginPass: s.loginPass ?? '', profileLocked: s.profileLocked ?? false };
            });
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [loginInputUser, setLoginInputUser] = useState('');
            const [loginInputPass, setLoginInputPass] = useState('');

            const [invoiceModal, setInvoiceModal] = useState(null); 
            const [invoiceItems, setInvoiceItems] = useState([]); 
            const [invoiceRabatt, setInvoiceRabatt] = useState(0);
            const [invoiceVersand, setInvoiceVersand] = useState(0);
            const [invoiceZahlart, setInvoiceZahlart] = useState('Überweisung');
            const [buchung, setBuchung] = useState({ typ: 'Ausgabe', mitLager: false, lagerId: '', menge: 1, label: '', betrag: '' });

            const [currentTime, setCurrentTime] = useState(new Date());
            const [weather, setWeather] = useState({ temp: '--', desc: 'Wetter laden...' });

            const [lager, setLager] = useState(() => {
                const saved = JSON.parse(localStorage.getItem('pyro_lager')) || [];
                return Array.isArray(saved) ? saved.map(l => ({ ...l, fotos: Array.isArray(l.fotos) ? l.fotos : (l.foto ? [l.foto] : []), gewicht: l.gewicht || '', rezeptur: Array.isArray(l.rezeptur) ? l.rezeptur : [] })) : [];
            });
            const [kunden, setKunden] = useState(() => {
                const saved = JSON.parse(localStorage.getItem('pyro_kunden')) || [];
                return Array.isArray(saved) ? saved.map(k => ({ ...k, rechnungsHistorie: Array.isArray(k.rechnungsHistorie) ? k.rechnungsHistorie : [], gesamtUmsatz: parseFloat(k.gesamtUmsatz) || 0 })) : [];
            });
            const [finanzen, setFinanzen] = useState(() => {
                const f = JSON.parse(localStorage.getItem('pyro_finanzen')) || { einnahmen: [], ausgaben: [] };
                return { einnahmen: Array.isArray(f.einnahmen) ? f.einnahmen : [], ausgaben: Array.isArray(f.ausgaben) ? f.ausgaben : [] };
            });
            const [firma, setFirma] = useState(() => {
                const f = JSON.parse(localStorage.getItem('pyro_firma'));
                if (!f) return {
                    name: '', inhaber: '', adresse: '', hausnummer: '', plz: '', ort: '', ustid: '', steuerNr: '', bank: '', iban: '', bic: '', telefon: '', email: '', webseite: '', logo: '', kundenNrStart: 1000,
                    formatRechnung: 'RE-{YYYY}-{MM}-{NR}', currentRechnung: 1000, formatStorno: 'ST-{YYYY}-{NR}', currentStorno: 100, formatRetoure: 'RT-{YYYY}-{NR}', currentRetoure: 100, isKleinunternehmer: true
                };
                return { 
                    name: f.name ?? '', inhaber: f.inhaber ?? '', adresse: f.adresse ?? '', hausnummer: f.hausnummer ?? '', plz: f.plz ?? '', ort: f.ort ?? '', ustid: f.ustid ?? '', steuerNr: f.steuerNr ?? '', bank: f.bank ?? '', iban: f.iban ?? '', bic: f.bic ?? '', telefon: f.telefon ?? '', email: f.email ?? '', webseite: f.webseite ?? '', logo: f.logo ?? '', 
                    kundenNrStart: parseInt(f.kundenNrStart) || 1000, formatRechnung: f.formatRechnung ?? 'RE-{YYYY}-{MM}-{NR}', currentRechnung: parseInt(f.currentRechnung) || 1000,
                    formatStorno: f.formatStorno ?? 'ST-{YYYY}-{NR}', currentStorno: parseInt(f.currentStorno) || 100, formatRetoure: f.formatRetoure ?? 'RT-{YYYY}-{NR}', currentRetoure: parseInt(f.currentRetoure) || 100, 
                    isKleinunternehmer: f.isKleinunternehmer !== undefined ? f.isKleinunternehmer : true
                };
            });

            useEffect(() => {
                localStorage.setItem('pyro_lager', JSON.stringify(lager)); localStorage.setItem('pyro_kunden', JSON.stringify(kunden)); localStorage.setItem('pyro_finanzen', JSON.stringify(finanzen));
                localStorage.setItem('pyro_firma', JSON.stringify(firma)); localStorage.setItem('pyro_settings', JSON.stringify(appSettings)); localStorage.setItem('pyro_dark', JSON.stringify(isDark));
                if (window.lucide) window.lucide.createIcons();
            }, [lager, kunden, finanzen, firma, appSettings, isDark, view]);

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                fetch('https://api.open-meteo.com/v1/forecast?latitude=51.16&longitude=10.45&current_weather=true')
                    .then(res => res.json()).then(data => { if(data?.current_weather) setWeather({ temp: data.current_weather.temperature, desc: 'Aktuell' }); })
                    .catch(() => setWeather({ temp: '--', desc: 'Offline' }));
                return () => clearInterval(timer);
            }, []);

            const requireMasterPass = (actionCallback) => {
                const pass = window.prompt("Sicherheitsprüfung: Bitte Master-Passwort eingeben.");
                if (pass === appSettings.masterPassword) { actionCallback(); } else if (pass !== null) { alert("Zugriff verweigert! Falsches Passwort."); }
            };

            const handleSystemReset = () => {
                const pass = window.prompt("ACHTUNG! SYSTEM-RESET!\nDies löscht ALLE Kunden, Lagerbestände und Rechnungen unwiderruflich.\nBitte gib das Masterpasswort ein (Standard: MASTER oder dein eigenes):");
                if (pass === "MASTER" || pass === appSettings.masterPassword) {
                    if (window.confirm("Bist du dir absolut sicher? Diese Aktion kann NICHT rückgängig gemacht werden!")) { localStorage.clear(); window.location.reload(); }
                } else if (pass !== null) { alert("Falsches Passwort! System-Reset abgebrochen."); }
            };

            const handleLogin = (e) => { 
                e.preventDefault(); 
                if (loginInputUser === 'Admin' && loginInputPass === 'Godmode') { setIsLoggedIn(true); return; }
                if (loginInputUser === appSettings.loginUser && loginInputPass === appSettings.loginPass) { setIsLoggedIn(true); } else { alert("Falsche Daten!"); }
            };

            const downloadBackup = () => {
                const backupData = { lager, kunden, finanzen, firma, appSettings };
                const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: "application/json" });
                const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `PyRoERP_Backup_${new Date().toISOString().split('T')[0]}.json`; link.click();
            };

            const restoreBackup = (e) => {
                const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if(data.lager && data.kunden) {
                            if(confirm("ACHTUNG: Dies überschreibt alle aktuellen Daten. Fortfahren?")) {
                                setLager(data.lager); setKunden(data.kunden); setFinanzen(data.finanzen); setFirma(data.firma); setAppSettings(data.appSettings); alert("System erfolgreich wiederhergestellt!");
                            }
                        } else { alert("Ungültige Backup-Datei!"); }
                    } catch (error) { alert("Fehler beim Lesen der Datei!"); }
                }; reader.readAsText(file);
            };

            // Menü-Wechsel Helper für Mobile
            const changeView = (newView) => {
                setView(newView);
                setIsMobileMenuOpen(false); // Schließt das Menü auf dem Handy nach Klick
            };

            const addArtikel = (typ) => { setLager([{ id: Date.now(), typ, bezeichnung: '', menge: 0, preis: 0, einkaufspreis: 0, artNr: 'ART-'+Math.floor(Math.random()*9000), herstellerNr: '', ean: '', masse: '', gewicht: '', gemisch: '', farbe: '', variationen: '', bemerkung: '', fotos: [], rezeptur: [], mindestbestand: 0, hoechstbestand: 0, letzteBestellung: '' }, ...lager]); };
            const updateLager = (id, field, val) => { setLager(lager.map(l => l.id === id ? { ...l, [field]: val } : l)); };
            const produziere = (produkt) => {
                const kannProduziert = (produkt.rezeptur||[]).every(r => { const m = lager.find(x => x.id === r.matId); return m && (parseFloat(m.menge)||0) >= (parseFloat(r.mengeBenoetigt)||0); });
                if(!kannProduziert) return alert("Nicht genügend Rohmaterialien im Lager!");
                setLager(lager.map(item => { const rez = (produkt.rezeptur||[]).find(r => r.matId === item.id); if (rez) return { ...item, menge: (parseFloat(item.menge)||0) - (parseFloat(rez.mengeBenoetigt)||0) }; if (item.id === produkt.id) return { ...item, menge: (parseFloat(item.menge)||0) + 1 }; return item; }));
                alert(`Erfolgreich 1x produziert.`);
            };

            const handlePhotoUpload = (id, file) => { if(!file) return; compressImage(file, (compressedDataUrl) => { setLager(lager.map(l => l.id === id ? { ...l, fotos: [...(l.fotos||[]), compressedDataUrl] } : l)); }); };
            const removePhoto = (id, index) => { setLager(lager.map(l => { if(l.id !== id) return l; const newFotos = [...l.fotos]; newFotos.splice(index, 1); return { ...l, fotos: newFotos }; })); };
            const shareProduct = async (produkt) => {
                const text = `🔥 Neues Produkt: ${produkt.bezeichnung}\n💰 Preis: ${produkt.preis} €\n⚖️ Gewicht: ${produkt.gewicht || '-'}\n📐 Maße: ${produkt.masse || '-'}\nℹ️ ${produkt.bemerkung || ''}\n\nJetzt anfragen!`;
                if (navigator.share) { try { await navigator.share({ title: produkt.bezeichnung, text: text }); } catch (e) {} } else { navigator.clipboard.writeText(text); alert("Produkt-Infos in die Zwischenablage kopiert!"); }
            };

            const safeSearchLager = (searchTermLager || '').toLowerCase();
            const filteredLager = lager.filter(l => ((l.bezeichnung||'') + ' ' + (l.artNr||'') + ' ' + (l.ean||'') + ' ' + (l.herstellerNr||'')).toLowerCase().includes(safeSearchLager));

            const addKunde = () => { setKunden([{ id: Date.now(), kdNr: `KD-${firma.kundenNrStart + kunden.length}`, typ: 'Privat', anrede: 'Herr', firma: '', vorname: '', nachname: '', strasse: '', hausnummer: '', plz: '', ort: '', land: 'Deutschland', telefon: '', mobil: '', email: '', newsletter: false, notizen: '', gesamtUmsatz: 0, rechnungsHistorie: [] }, ...kunden]); };
            const safeSearchKunden = (searchTermKunden || '').toLowerCase();
            const filteredKunden = kunden.filter(k => ((k.vorname||'') + ' ' + (k.nachname||'') + ' ' + (k.kdNr||'') + ' ' + (k.firma||'')).toLowerCase().includes(safeSearchKunden));

            const handleBuchung = (e) => {
                e.preventDefault();
                if(!buchung.label || !buchung.betrag) return;
                const betragFloat = parseFloat(buchung.betrag);
                if(buchung.mitLager && buchung.lagerId) {
                    const art = lager.find(l => l.id === parseInt(buchung.lagerId));
                    if(art) {
                        let nMg = parseFloat(art.menge)||0; if(buchung.typ === 'Ausgabe') nMg += parseInt(buchung.menge); else nMg -= parseInt(buchung.menge);
                        setLager(lager.map(l => l.id === art.id ? {...l, menge: nMg, letzteBestellung: (buchung.typ === 'Ausgabe' ? new Date().toISOString().split('T')[0] : l.letzteBestellung)} : l));
                    }
                }
                const nB = { id: Date.now(), datum: new Date().toLocaleDateString(), label: buchung.label, betrag: betragFloat };
                if(buchung.typ === 'Einnahme') setFinanzen({...finanzen, einnahmen: [nB, ...(finanzen.einnahmen||[])]}); else setFinanzen({...finanzen, ausgaben: [nB, ...(finanzen.ausgaben||[])]});
                alert(`${buchung.typ} gebucht!`); setBuchung({ typ: 'Ausgabe', mitLager: false, lagerId: '', menge: 1, label: '', betrag: '' });
            };

            const exportTaxCSV = () => {
                let csv = "Buchungsdatum;Beleg/Label;Art;Bruttobetrag;Steuersatz;Nettobetrag;Steuerbetrag\n";
                const steuersatz = firma.isKleinunternehmer ? 0 : 19;
                (finanzen.einnahmen||[]).forEach(e => {
                    const netto = (parseFloat(e.betrag)||0) / (1 + (steuersatz/100)); const steuer = (parseFloat(e.betrag)||0) - netto;
                    csv += `${e.datum};${e.label};Einnahme;${(parseFloat(e.betrag)||0).toFixed(2)};${steuersatz}%;${netto.toFixed(2)};${steuer.toFixed(2)}\n`;
                });
                (finanzen.ausgaben||[]).forEach(a => {
                    const netto = (parseFloat(a.betrag)||0) / (1 + (steuersatz/100)); const steuer = (parseFloat(a.betrag)||0) - netto;
                    csv += `${a.datum};${a.label};Ausgabe;${(parseFloat(a.betrag)||0).toFixed(2)};${steuersatz}%;${netto.toFixed(2)};${steuer.toFixed(2)}\n`;
                });
                const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' })); link.setAttribute("download", `EUER_Steuer_Export_${new Date().toISOString().split('T')[0]}.csv`); link.click();
            };

            const exportCSV = (type) => {
                let csv = "";
                if(type === 'kunden') { csv = "KD-Nr;Typ;Firma;Vorname;Nachname;Strasse;Nr;PLZ;Ort;Email;Telefon;Umsatz\n"; kunden.forEach(k => csv += `${k.kdNr||''};${k.typ||''};${k.firma||''};${k.vorname||''};${k.nachname||''};${k.strasse||''};${k.hausnummer||''};${k.plz||''};${k.ort||''};${k.email||''};${k.telefon||''};${k.gesamtUmsatz||0}\n`);
                } else if (type === 'lager') { csv = "Art-Nr;Bezeichnung;Typ;Bestand;EK;VK;EAN\n"; lager.forEach(l => csv += `${l.artNr||''};${l.bezeichnung||''};${l.typ||''};${l.menge||0};${l.einkaufspreis||0};${l.preis||0};${l.ean||''}\n`);
                } else { csv = "Datum;Typ;Bezeichnung;Betrag\n"; finanzen.einnahmen.forEach(e => csv += `${e.datum};Einnahme;${e.label};${e.betrag}\n`); finanzen.ausgaben.forEach(a => csv += `${a.datum};Ausgabe;${a.label};${a.betrag}\n`); }
                const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' })); link.setAttribute("download", `${type}_export.csv`); link.click();
            };

            const openInvoice = (k) => { setInvoiceModal(k); setInvoiceItems([]); setInvoiceRabatt(0); setInvoiceVersand(0); setInvoiceZahlart('Überweisung'); };

            const generatePDF = (type, kundeObj, rechnungsDaten = null) => {
                if(type === 'Rechnung' && invoiceItems.length === 0) return alert("Keine Artikel gewählt.");
                const doc = new jsPDF(); const d = new Date().toLocaleDateString();
                let dokNr = "";
                if(type === 'Rechnung') dokNr = generateNumber(firma.formatRechnung, firma.currentRechnung);
                if(type === 'Storno') dokNr = generateNumber(firma.formatStorno, firma.currentStorno);
                if(type === 'Retoure') dokNr = generateNumber(firma.formatRetoure, firma.currentRetoure);

                if(firma.logo) { try { doc.addImage(firma.logo, 'PNG', 150, 15, 40, 20); } catch(e){} }
                let contactInfo = `Tel: ${firma.telefon||'-'} | Mail: ${firma.email||'-'}`; if(firma.webseite) contactInfo += `\nWeb: ${firma.webseite}`;
                if(firma.name && firma.name.trim() !== "") { doc.setFontSize(22).text(firma.name, 20, 20); doc.setFontSize(9).text(`${firma.inhaber}\n${firma.adresse} ${firma.hausnummer}\n${firma.plz} ${firma.ort}\n${contactInfo}`, 20, 27); } 
                else { doc.setFontSize(18).text(firma.inhaber||'Business', 20, 20); doc.setFontSize(9).text(`${firma.adresse} ${firma.hausnummer}\n${firma.plz} ${firma.ort}\n${contactInfo}`, 20, 27); }

                doc.setFontSize(12).setFont(undefined, 'bold').text(type.toUpperCase(), 140, 42);
                doc.setFontSize(10).setFont(undefined, 'normal').text(`Nr: ${dokNr}\nDatum: ${d}\n${type==='Rechnung'?'Zahlart: '+invoiceZahlart : 'Bezug auf: '+(rechnungsDaten?.nr||'')}`, 140, 48);
                doc.setFontSize(11).text("Empfänger:", 20, 60); doc.text(`${kundeObj.firma ? kundeObj.firma+'\n' : ''}${kundeObj.anrede||''} ${kundeObj.vorname||''} ${kundeObj.nachname||''}\n${kundeObj.strasse||''} ${kundeObj.hausnummer||''}\n${kundeObj.plz||''} ${kundeObj.ort||''}\n${kundeObj.land||''}`, 20, 67);

                let itemsToPrint = type === 'Rechnung' ? invoiceItems : (rechnungsDaten ? rechnungsDaten.items : []);
                const subtotal = itemsToPrint.reduce((s, i) => s + ((parseFloat(i.preis)||0) * (parseInt(i.auswahlMenge)||0)), 0);
                let rabattVal = 0; let versandVal = 0; let total = 0;
                if(type === 'Rechnung') { rabattVal = subtotal * ((parseFloat(invoiceRabatt)||0) / 100); versandVal = parseFloat(invoiceVersand || 0); total = subtotal - rabattVal + versandVal; } 
                else { total = parseFloat(rechnungsDaten?.betrag || 0); }

                const tData = itemsToPrint.map((i, idx) => [(idx+1).toString(), i.artNr||'-', i.bezeichnung||'Artikel', (i.auswahlMenge||1).toString(), (parseFloat(i.preis)||0).toFixed(2)+' €', ((parseFloat(i.preis)||0)*(parseInt(i.auswahlMenge)||1)).toFixed(2)+' €']);
                if(type === 'Rechnung') {
                    if(rabattVal > 0) tData.push(['', '', '', '', `Rabatt (${invoiceRabatt}%):`, `-${rabattVal.toFixed(2)} €`]);
                    if(versandVal > 0) tData.push(['', '', '', '', 'Versand:', `${versandVal.toFixed(2)} €`]);
                }
                tData.push(['', '', '', '', type === 'Rechnung' ? 'Gesamtbetrag:' : 'Gutschrift/Storno:', `${type==='Rechnung'?'':'-'}${total.toFixed(2)} €`]);

                const finalY = doc.lastAutoTable.finalY; doc.setFontSize(8);
                if(firma.isKleinunternehmer) doc.text("Hinweis: Kleinunternehmerregelung § 19 UStG. Keine Umsatzsteuer ausgewiesen.", 20, finalY + 15);

                let footer = `Bank: ${firma.bank || '-'} | IBAN: ${firma.iban || '-'} | BIC: ${firma.bic || '-'}`;

                                <button onClick={()=>changeView('finanzen')} className={`w-full flex items-center gap-3 p-4 rounded-xl ${view==='finanzen'?'bg-indigo-600 shadow-lg':'text-slate-400 hover:bg-white/5'}`}><Icon name="trending-up"/> EÜR & Finanzen</button>
                                <button onClick={()=>changeView('settings')} className={`w-full flex items-center gap-3 p-4 rounded-xl ${view==='settings'?'bg-indigo-600 shadow-lg':'text-slate-400 hover:bg-white/5'}`}><Icon name="settings"/> Profil & Setup</button>

                            {/* --- FINANZEN --- */}
                            {view === 'finanzen' && (
                                <div className="max-w-6xl mx-auto space-y-8 animate-fade">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                                        <h2 className="text-3xl md:text-4xl font-black">EÜR & Buchhaltung</h2>
                                        <div className="flex flex-wrap gap-2 w-full sm:w-auto">
                                            <button onClick={()=>exportCSV('finanzen')} className="flex-1 sm:flex-none bg-white dark:bg-slate-900 border dark:border-slate-800 px-4 md:px-6 py-3 rounded-xl font-bold shadow-sm flex items-center justify-center gap-2 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm md:text-base"><Icon name="download" size={16}/> Standard CSV</button>
                                            <button onClick={exportTaxCSV} className="w-full sm:w-auto bg-indigo-600 text-white px-4 md:px-6 py-3 rounded-xl font-bold shadow-lg flex items-center justify-center gap-2 hover:bg-indigo-700 text-sm md:text-base"><Icon name="file-text" size={16}/> Steuer-Export</button>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                        <div className="bg-white dark:bg-slate-900 p-6 md:p-10 rounded-[2rem] md:rounded-[3rem] shadow-sm border border-slate-100 dark:border-slate-800">
                                            <h3 className="text-lg md:text-xl font-black mb-6 flex items-center gap-2 text-indigo-600 dark:text-indigo-400"><Icon name="plus-circle"/> Manuelle Buchung</h3>
                                            <form onSubmit={handleBuchung} className="space-y-4">
                                                <div className="flex flex-col sm:flex-row gap-4">
                                                    <select value={buchung.typ} onChange={e=>setBuchung({...buchung, typ: e.target.value})} className="w-full sm:flex-1 bg-slate-50 dark:bg-slate-800 p-3 rounded-xl outline-none font-bold text-slate-900 dark:text-white border border-transparent focus:border-indigo-400"><option>Ausgabe</option><option>Einnahme</option></select>
                                                    <InputField label="Betrag (€)" type="number" value={buchung.betrag} onChange={v=>setBuchung({...buchung, betrag:v})} extraClass="font-bold text-lg w-full sm:w-auto"/>
                                                </div>
                                                <InputField label="Buchungstext (Wofür/Woher?)" value={buchung.label} onChange={v=>setBuchung({...buchung, label:v})} extraClass="font-bold"/>
                                                
                                                <div className="p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl border border-slate-100 dark:border-slate-700 mt-4 space-y-3">
                                                    <label className="flex items-center gap-2 font-bold text-sm cursor-pointer"><input type="checkbox" checked={buchung.mitLager} onChange={e=>setBuchung({...buchung, mitLager: e.target.checked})} className="accent-indigo-600 w-4 h-4 shrink-0"/> Mit Lagerbestand verknüpfen</label>
                                                    {buchung.mitLager && (
                                                        <div className="flex flex-col sm:flex-row gap-2 items-start sm:items-end">
                                                            <div className="w-full sm:flex-1">
                                                                <label className="text-[10px] font-bold text-slate-400 uppercase">Artikel wählen</label>
                                                                <select value={buchung.lagerId} onChange={e=>setBuchung({...buchung, lagerId: e.target.value})} className="w-full bg-white dark:bg-slate-900 border dark:border-slate-700 p-2 rounded-xl text-sm outline-none text-slate-900 dark:text-white">
                                                                    <option value="">Bitte wählen...</option>
                                                                    {lager.filter(l => buchung.typ === 'Ausgabe' ? l.typ === 'Material' : l.typ === 'Endprodukt').map(l => <option key={l.id} value={l.id}>{l.artNr} - {l.bezeichnung} ({l.menge} da)</option>)}
                                                                </select>
                                                            </div>
                                                            <div className="w-full sm:w-24 mt-2 sm:mt-0"><label className="text-[10px] font-bold text-slate-400 uppercase">Menge</label><input type="number" min="1" value={buchung.menge} onChange={e=>setBuchung({...buchung, menge: e.target.value})} className="w-full bg-white dark:bg-slate-900 border dark:border-slate-700 p-2 rounded-xl text-sm text-center outline-none"/></div>
                                                        </div>
                                                    )}
                                                </div>
                                                <button type="submit" className="w-full bg-slate-900 dark:bg-indigo-600 text-white p-4 rounded-xl font-bold shadow-lg mt-4 hover:opacity-80 transition-opacity">Buchung speichern</button>
                                            </form>
                                        </div>
                                        <div className="bg-slate-900 dark:bg-[#0F172A] p-6 md:p-10 rounded-[2rem] md:rounded-[3rem] shadow-xl text-white border border-transparent dark:border-slate-800">
                                            <h3 className="text-lg md:text-xl font-black mb-6 text-indigo-400">Buchungs-Journal</h3>
                                            <div className="space-y-2 max-h-[300px] md:max-h-[400px] overflow-y-auto custom-scrollbar pr-2">
                                                {[...(finanzen.einnahmen||[]).map(x=>({...x, t:'in'})), ...(finanzen.ausgaben||[]).map(x=>({...x, t:'out'}))].sort((a,b)=>b.id-a.id).map(b => (
                                                    <div key={b.id} className="flex justify-between items-center bg-white/10 p-3 md:p-4 rounded-2xl border border-white/5 gap-2">
                                                        <div className="text-xs min-w-0"><p className="font-bold truncate">{b.label}</p><p className="text-slate-400 text-[10px]">{b.datum}</p></div>
                                                        <span className={`font-black shrink-0 ${b.t==='in'?'text-emerald-400':'text-rose-400'}`}>{b.t==='in'?'+':'-'}{(parseFloat(b.betrag)||0).toFixed(2)}€</span>
                                                    </div>
                                                ))}
                                                {(finanzen.einnahmen||[]).length === 0 && (finanzen.ausgaben||[]).length === 0 && <p className="text-slate-500 text-center py-4 text-sm">Keine Buchungen vorhanden.</p>}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* --- SETTINGS --- */}
                            {view === 'settings' && (
                                <div className="max-w-4xl mx-auto space-y-8 animate-fade pb-10">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                                        <h2 className="text-3xl md:text-4xl font-black">Profil & Setup</h2>
                                        <button onClick={() => appSettings.profileLocked ? requireMasterPass(() => setAppSettings({...appSettings, profileLocked: false})) : setAppSettings({...appSettings, profileLocked: true})} className={`w-full sm:w-auto px-6 py-3 rounded-xl font-bold shadow-md flex justify-center items-center gap-2 transition-colors ${appSettings.profileLocked ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-rose-500 text-white hover:bg-rose-600'}`}>
                                            <Icon name={appSettings.profileLocked ? 'lock' : 'unlock'} size={18}/> {appSettings.profileLocked ? 'Profil entsperren' : 'Profil sperren'}
                                        </button>
                                    </div>

                                    <div className={`bg-white dark:bg-slate-900 p-6 md:p-10 rounded-[2rem] md:rounded-[3rem] shadow-sm border border-slate-100 dark:border-slate-800 grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-6 transition-opacity ${appSettings.profileLocked ? 'opacity-70 pointer-events-none' : ''}`}>
                                        <div className="sm:col-span-2 flex flex-col sm:flex-row items-center sm:items-start gap-4 sm:gap-6 mb-4 text-center sm:text-left">
                                            <div className="w-20 h-20 md:w-24 md:h-24 bg-slate-50 dark:bg-slate-800 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-2xl flex items-center justify-center relative overflow-hidden shrink-0">
                                                {firma.logo ? <img src={firma.logo} className="w-full h-full object-contain" /> : <Icon name="image" className="text-slate-400"/>}
                                                <input type="file" disabled={appSettings.profileLocked} className="absolute inset-0 opacity-0 disabled:cursor-not-allowed cursor-pointer" onChange={(e)=>{ const r = new FileReader(); r.onload = () => setFirma({...firma, logo:r.result}); r.readAsDataURL(e.target.files[0]); }}/>
                                            </div>
                                            <div className="pt-2"><p className="font-bold">Firmen-Logo</p><p className="text-[10px] md:text-xs text-slate-400 mt-1">Erscheint oben rechts auf PDF-Dokumenten. Klick auf das Feld zum Hochladen.</p></div>
                                        </div>
                                        <InputField disabled={appSettings.profileLocked} label="Firmenname" value={firma.name} onChange={v=>setFirma({...firma, name:v})} extraClass="font-black text-indigo-600 dark:text-indigo-400" colSpan="sm:col-span-1"/>
                                        <InputField disabled={appSettings.profileLocked} label="Inhaber" value={firma.inhaber} onChange={v=>setFirma({...firma, inhaber:v})} colSpan="sm:col-span-1"/>
                                        <InputField disabled={appSettings.profileLocked} label="Strasse" value={firma.adresse} onChange={v=>setFirma({...firma, adresse:v})} colSpan="sm:col-span-1"/>
                                        <InputField disabled={appSettings.profileLocked} label="Hausnummer" value={firma.hausnummer} onChange={v=>setFirma({...firma, hausnummer:v})} colSpan="sm:col-span-1"/>
                                        <InputField disabled={appSettings.profileLocked} label="PLZ" value={firma.plz} onChange={v=>setFirma({...firma, plz:v})} colSpan="sm:col-span-1"/>
                                        <InputField disabled={appSettings.profileLocked} label="Ort" value={firma.ort} onChange={v=>setFirma({...firma, ort:v})} colSpan="sm:col-span-1"/>
                                        <InputField disabled={appSettings.profileLocked} label="Telefon" value={firma.telefon} onChange={v=>setFirma({...firma, telefon:v})} colSpan="sm:col-span-1"/>
                                        <InputField disabled={appSettings.profileLocked} label="E-Mail" value={firma.email} onChange={v=>setFirma({...firma, email:v})} colSpan="sm:col-span-1"/>
                                        <InputField disabled={appSettings.profileLocked} label="Webseite" value={firma.webseite} onChange={v=>setFirma({...firma, webseite:v})} colSpan="sm:col-span-2"/>
                                        
                                        <div className="sm:col-span-2 pt-6 mt-2 border-t border-slate-100 dark:border-slate-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                            <p className="font-black text-xs uppercase text-indigo-500">Steuer & Bankdaten</p>
                                            <label className={`flex items-center gap-2 text-sm font-bold text-slate-500 ${appSettings.profileLocked?'cursor-not-allowed':'cursor-pointer'}`}><input type="checkbox" disabled={appSettings.profileLocked} checked={firma.isKleinunternehmer} onChange={e=>setFirma({...firma, isKleinunternehmer: e.target.checked})} className="accent-indigo-600 w-4 h-4 shrink-0"/> <span className="text-xs md:text-sm">Kleinunternehmerregelung aktiv</span></label>
                                        </div>
                                        <InputField disabled={appSettings.profileLocked} label="USt-ID (Optional)" value={firma.ustid} onChange={v=>setFirma({...firma, ustid:v})} colSpan="sm:col-span-1"/>
                                        <InputField disabled={appSettings.profileLocked} label="Steuer-Nummer (Optional)" value={firma.steuerNr} onChange={v=>setFirma({...firma, steuerNr:v})} colSpan="sm:col-span-1"/>
                                        <InputField disabled={appSettings.profileLocked} label="Bankname" value={firma.bank} onChange={v=>setFirma({...firma, bank:v})} colSpan="sm:col-span-2"/>
                                        <InputField disabled={appSettings.profileLocked} label="IBAN" value={firma.iban} onChange={v=>setFirma({...firma, iban:v})} colSpan="sm:col-span-1"/>
                                        <InputField disabled={appSettings.profileLocked} label="BIC" value={firma.bic} onChange={v=>setFirma({...firma, bic:v})} colSpan="sm:col-span-1"/>

                                        <div className="sm:col-span-2 pt-6 mt-2 border-t border-slate-100 dark:border-slate-800">
                                            <p className="font-black text-xs uppercase text-indigo-500 mb-2">Nummernkreisläufe (Matrix)</p>
                                            <p className="text-[10px] text-slate-400 mb-4 leading-relaxed">Platzhalter: <br className="sm:hidden"/>{`{YYYY}`} = Jahr, {`{MM}`} = Monat, {`{NR}`} = Fortlaufende Nummer.</p>
                                        </div>
                                        
                                        <div className="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl sm:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <InputField disabled={appSettings.profileLocked} label="Matrix: Rechnung" value={firma.formatRechnung} onChange={v=>setFirma({...firma, formatRechnung:v})} extraClass="font-mono text-xs text-indigo-600 dark:text-indigo-400"/>
                                            <InputField disabled={appSettings.profileLocked} label="Nächste Rechnungs-Nr" type="number" value={firma.currentRechnung} onChange={v=>setFirma({...firma, currentRechnung:v})} extraClass="font-mono text-xs"/>
                                        </div>
                                        <div className="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl sm:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <InputField disabled={appSettings.profileLocked} label="Matrix: Storno" value={firma.formatStorno} onChange={v=>setFirma({...firma, formatStorno:v})} extraClass="font-mono text-xs text-rose-500 dark:text-rose-400"/>
                                            <InputField disabled={appSettings.profileLocked} label="Nächste Storno-Nr" type="number" value={firma.currentStorno} onChange={v=>setFirma({...firma, currentStorno:v})} extraClass="font-mono text-xs"/>
                                        </div>
                                        <div className="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl sm:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <InputField disabled={appSettings.profileLocked} label="Matrix: Retoure" value={firma.formatRetoure} onChange={v=>setFirma({...firma, formatRetoure:v})} extraClass="font-mono text-xs text-amber-500 dark:text-amber-400"/>
                                            <InputField disabled={appSettings.profileLocked} label="Nächste Retouren-Nr" type="number" value={firma.currentRetoure} onChange={v=>setFirma({...firma, currentRetoure:v})} extraClass="font-mono text-xs"/>
                                        </div>
                                        <InputField disabled={appSettings.profileLocked} label="Startwert Kundennummern" type="number" value={firma.kundenNrStart} onChange={v=>setFirma({...firma, kundenNrStart:v})} colSpan="sm:col-span-2"/>
                                    </div>

                                    {/* BACKUP & RESTORE */}
                                    <div className="bg-emerald-50 dark:bg-emerald-900/10 p-6 md:p-8 rounded-[2rem] md:rounded-[3rem] border border-emerald-100 dark:border-emerald-900/30 grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                                        <div><h3 className="text-lg md:text-xl font-black text-emerald-600 dark:text-emerald-400 mb-2 flex items-center gap-2"><Icon name="database"/> System-Backup</h3><p className="text-xs text-emerald-800/60 dark:text-emerald-300/60 leading-relaxed">Sichere alle deine Daten regelmäßig als JSON-Datei.</p></div>
                                        <div className="flex flex-col gap-3 w-full">
                                            <button onClick={downloadBackup} className="w-full bg-emerald-600 text-white p-3 md:p-4 rounded-xl font-bold text-xs md:text-sm shadow-md hover:bg-emerald-700 flex justify-center items-center gap-2 transition-colors"><Icon name="download" size={16}/> Backup laden (JSON)</button>
                                            <label className="w-full bg-white dark:bg-slate-800 border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-400 p-3 md:p-4 rounded-xl font-bold text-xs md:text-sm text-center cursor-pointer hover:bg-emerald-50 dark:hover:bg-emerald-900/40 transition-colors flex justify-center items-center gap-2">
                                                <Icon name="upload" size={16}/> Wiederherstellen
                                                <input type="file" accept=".json" onChange={restoreBackup} className="hidden"/>
                                            </label>
                                        </div>
                                    </div>

                                    {/* SECURITY SECTION */}
                                    <div className="bg-indigo-50 dark:bg-indigo-900/10 p-6 md:p-10 rounded-[2rem] md:rounded-[3rem] border border-indigo-100 dark:border-indigo-900/30">
                                        <h3 className="text-lg md:text-xl font-black text-indigo-600 dark:text-indigo-400 mb-6 flex items-center gap-2"><Icon name="shield"/> Sicherheit & Login</h3>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-6">
                                            <InputField label="Master-Passwort (Für Löschungen & Reset)" value={appSettings.masterPassword} onChange={v=>setAppSettings({...appSettings, masterPassword:v})} extraClass="font-bold text-indigo-600 dark:text-indigo-400" colSpan="sm:col-span-1"/>
                                            <div className="flex items-center gap-3 sm:pt-6">
                                                <input type="checkbox" checked={appSettings.loginEnabled} onChange={e=>setAppSettings({...appSettings, loginEnabled:e.target.checked})} className="w-5 h-5 accent-indigo-600 shrink-0"/>
                                                <span className="font-bold text-xs md:text-sm">System-Login beim Start verlangen</span>
                                            </div>
                                            {appSettings.loginEnabled && (
                                                <>
                                                    <InputField label="Login Benutzername" value={appSettings.loginUser} onChange={v=>setAppSettings({...appSettings, loginUser:v})} colSpan="sm:col-span-1"/>
                                                    <InputField label="Login Passwort" type="password" value={appSettings.loginPass} onChange={v=>setAppSettings({...appSettings, loginPass:v})} colSpan="sm:col-span-1"/>
                                                </>
                                            )}
                                        </div>
                                    </div>
                                    
                                    {/* SYSTEM RESET SECTION */}
                                    <div className="pt-6 md:pt-8 border-t border-rose-200 dark:border-rose-900/50">
                                        <div className="bg-rose-100 dark:bg-rose-900/20 p-6 md:p-8 rounded-[2rem] border border-rose-200 dark:border-rose-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 md:gap-6 shadow-inner">
                                            <div className="w-full md:w-2/3">
                                                <h3 className="text-lg md:text-xl font-black text-rose-600 dark:text-rose-400 mb-2 flex items-center gap-2"><Icon name="alert-octagon"/> System-Reset</h3>
                                                <p className="text-xs text-rose-800/70 dark:text-rose-300/70 leading-relaxed">Löscht ALLE Kunden, Lagerbestände, Rechnungen und Einstellungen unwiderruflich vom Gerät.</p>
                                            </div>
                                            <button onClick={handleSystemReset} className="w-full md:w-auto bg-rose-600 text-white px-4 md:px-6 py-3 md:py-4 rounded-xl font-bold shadow-lg hover:bg-rose-700 flex justify-center items-center gap-2 transition-colors text-sm md:text-base shrink-0"><Icon name="trash-2" size={18}/> System löschen</button>
                                        </div>
                                    </div>

                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
