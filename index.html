<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyRoERP - Handmade Management</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-[#F8FAFC]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Hier kommt die gesamte Logik von oben rein (Dashboard, Lager, Produktion)
        // Zur Demonstration hier das Grundgerüst:
        function App() {
            const [view, setView] = useState('dashboard');
            const [lager, setLager] = useState(() => JSON.parse(localStorage.getItem('pyro_lager')) || []);

            return (
                <div className="flex h-screen">
                    <aside className="w-64 bg-[#0F172A] text-white p-6 flex flex-col">
                        <h1 className="text-2xl font-black text-indigo-400 mb-10">PyRoERP</h1>
                        <nav className="flex-1 space-y-2">
                            <button onClick={() => setView('dashboard')} className="w-full text-left p-3 rounded-xl hover:bg-white/10">Dashboard</button>
                            <button onClick={() => setView('lager')} className="w-full text-left p-3 rounded-xl hover:bg-white/10">Lager & Baugruppen</button>
                        </nav>
                        <div className="mt-auto border-t border-white/10 pt-4">
                            <p className="text-[10px] text-slate-500 uppercase">Entwickler</p>
                            <p className="text-sm font-bold text-indigo-300">Harald Haug</p>
                        </div>
                    </aside>
                    <main className="flex-1 p-10 overflow-auto">
                        <h2 className="text-3xl font-black mb-6 capitalize">{view}</h2>
                        <div className="bg-white p-10 rounded-[2.5rem] shadow-sm border border-slate-100">
                            Willkommen im PyRoERP Online-System.
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
